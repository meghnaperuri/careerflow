services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerflow
      POSTGRES_PASSWORD: careerflow
      POSTGRES_DB: careerflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerflow"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://careerflow:careerflow@db:5432/careerflow
      CAREERFLOW_API_KEY: ${CAREERFLOW_API_KEY:?Set CAREERFLOW_API_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  postgres_data:
